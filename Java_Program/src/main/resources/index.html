<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My S3 Static Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background: #4CAF50;
            padding: 20px;
            color: white;
            font-size: 24px;
        }

        .container {
            margin-top: 40px;
        }

        h2 {
            color: #333;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        a.button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
        }

        a.button:hover {
            background: #45a049;
        }
    </style>
</head>

<body>

<header>
    Welcome to My S3 Static Website
</header>

<div class="container">
    <h2>Hello from AWS S3!</h2>
    <p>This is a sample static website hosted on Amazon S3.</p>
    <p>Upload your HTML, CSS, JS files and make your own website!</p>

    <a class="button" href="https://aws.amazon.com/s3/" target="_blank">
        Learn More About S3
    </a>
</div>

</body>
</html>
